oneOf:
  - type: string
    pattern: '^-?\d+/(0[0-9]|1[01]|[0-9])$'

  - type: array
    maxItems: 2
    items:
      type: string
      pattern: '^-?\d+/(0[0-9]|1[01]|[0-9])$'

  - type: array
    items:
      type: array
      minItems: 2
      maxItems: 2
      items:
        - type: string
          pattern: '^-?\d+/(0[0-9]|1[01]|[0-9])$'
        - type: number