[project]
name = "ECS-LCA"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "bw-timex==1.2.1",
    "click>=8.5.0",
    "d3blocks>=2.0.0",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "lca-algebraic-bw25==1.4.1",
    "maxent-disaggregation>=1.3.4",
    "msal>=1.38.0",
    "polyviz>=1.0.4",
    "premise==2.5.2",
    "urwid>=4.1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[project.scripts]
treat_foreground = "ecs_lca.scripts.treat_foreground:run_lca"
excel_to_yaml = "ecs_lca.scripts.excel_to_yaml:main"
manage_database = "ecs_lca.scripts.manage_database:main"
method_selector = "ecs_lca.scripts.method_selector:main"
pathway_selector = "ecs_lca.scripts.pathway_selector:main"
check_activities = "ecs_lca.scripts.check_activities:main"
visualize_database = "ecs_lca.scripts.visualize_database:main"
visualize_sankey = "ecs_lca.scripts.visualize_sankey:main"
